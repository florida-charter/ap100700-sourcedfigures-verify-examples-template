name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    # Public repositories cannot use the org runner groups, and a public
    # workflow cannot call the private hooks action. ubuntu-latest plus the
    # hooks token keeps the private hook repo installable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require FCG bootstrap files
        run: |
          set -euo pipefail
          test -f .fcg/repo.yaml
          test -f CODEOWNERS
          test -f LICENSE
          test -f CLAUDE.md
          test -f llms-install.md
          test -f .github/dependabot.yml
          grep -q 'All rights reserved' LICENSE
          grep -q 'No license is granted' LICENSE
          grep -q 'Florida Charter Group LLC' LICENSE
          grep -q '\* @AtwoodTM' CODEOWNERS
          grep -q 'package-ecosystem: "github-actions"' .github/dependabot.yml
          grep -q 'Informational only. Not investment, legal or tax advice.' llms-install.md
          repo_name="${GITHUB_REPOSITORY##*/}"
          ap_id="$(printf '%s' "$repo_name" | sed -E 's/^(ap[0-9]+).*/\1/' | tr '[:lower:]' '[:upper:]')"
          suffix="${repo_name##*-}"
          test "$suffix" = "template"
          grep -q "^ap_id: ${ap_id}$" .fcg/repo.yaml
          grep -q "^repo: ${repo_name}$" .fcg/repo.yaml
          grep -q "^type: template$" .fcg/repo.yaml
          python3 scripts/damm_id.py verify AP100700
          test "$(python3 scripts/damm_id.py check 10070)" = "100700"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install prek
        env:
          PREK_VERSION: "0.5.4"
          PREK_SHA256: "6147dfe64051af590f4bfc2c073a0780fb5e2cc37d9eab8e47fe9fe26c7dfb80"  # pragma: allowlist secret
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSLo /tmp/prek.tar.gz \
            "https://github.com/j178/prek/releases/download/v${PREK_VERSION}/prek-x86_64-unknown-linux-gnu.tar.gz"
          echo "${PREK_SHA256}  /tmp/prek.tar.gz" | sha256sum -c -
          tar -xzf /tmp/prek.tar.gz -C /tmp
          install -m 0755 /tmp/prek-x86_64-unknown-linux-gnu/prek "$HOME/.local/bin/prek"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          prek --version
      - name: Install pre-commit hook environments
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.FCG_HOOKS_TOKEN }}@github.com/florida-charter/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/florida-charter/
          FCG_HOOKS_TOKEN: ${{ secrets.FCG_HOOKS_TOKEN }}
        run: |
          set -euo pipefail
          : "${FCG_HOOKS_TOKEN:?FCG_HOOKS_TOKEN is not available to this run; token-less runs fail closed (PLAT-900)}"
          unset FCG_HOOKS_TOKEN
          prek install-hooks
      - name: Run pre-commit
        run: prek run --all-files --show-diff-on-failure --color=always
